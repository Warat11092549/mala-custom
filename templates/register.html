<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สมัครสมาชิก - MALA CUSTOM</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="hero">
    <img class="hero-logo" src="{{ url_for('static', filename='images/theme/logo.png') }}" alt="Mala Custom">
    <p class="hero-tag">สมัครสมาชิก รับคะแนนสะสมและส่วนลด</p>
  </header>

  <main class="auth-box">
    <div class="card">
      <h2>สมัครสมาชิก</h2>

      {% for message in get_flashed_messages() %}
        <p class="msg">{{ message }}</p>
      {% endfor %}

      <form action="{{ url_for('register') }}" method="post" class="auth-form">
        <label>ชื่อที่ใช้แสดง</label>
        <input type="text" name="name" required>

        <label>ชื่อผู้ใช้ (อย่างน้อย 3 ตัว)</label>
        <input type="text" name="username" required>

        <label>รหัสผ่าน (อย่างน้อย 6 ตัว)</label>
        <input type="password" name="password" required>

        <label>ยืนยันรหัสผ่าน</label>
        <input type="password" name="confirm" required>

        <button class="btn">สมัครสมาชิก</button>
      </form>

      <p>มีบัญชีแล้ว? <a href="{{ url_for('login') }}">เข้าสู่ระบบ</a></p>
    </div>
  </main>
</body>
</html>
